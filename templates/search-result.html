<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search Result</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:50px;
    background:#111;
    font-family:Arial,sans-serif;
}
.h2{
    font-color:red;
    font-family: Arial, Helvetica, sans-serif;
    
}
.result-card{
    width:350px;
    background:#222;
    border-radius:15px;
    overflow:hidden;
    text-align:center;
    color:white;
    box-shadow:0 0 20px rgba(255,0,80,0.3);
}

.result-card img{
    width:100%;
    height:400px;
    object-fit:cover;
}

.result-card h2{
    padding:15px;
}

.btn{
    display:inline-block;
    margin-bottom:20px;
    padding:12px 20px;
    background:#ff2e63;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.not-found{
    color:white;
    font-size:28px;
}
.container{
    text-align:center;
}

.heading{
    color:#ff2e63;
    margin-bottom:25px;
    font-size:38px;
    text-shadow:0 0 15px rgba(255,46,99,0.5);
}

</style>
</head>

<body>

<div class="container">

    <h1 class="heading">
🔍 Search Results
</h1>

    <div id="result"></div>

</div>

<script>

const items = [

{title:"Pushpa 2",image:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba",page:"movies.html"},

{title:"Avengers Night",image:"https://images.unsplash.com/photo-1524712245354-2c4e5e7121c0",page:"events.html"},

{title:"Interstellar",image:"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa",page:"movies.html"},

{title:"Joker",image:"https://images.unsplash.com/photo-1503455637927-730bce8583c0",page:"movies.html"},

{title:"Marvel Universe",image:"https://images.unsplash.com/photo-1531259683007-016a7b628fc3",page:"movies.html"},

{title:"Batman",image:"https://images.unsplash.com/photo-1509048191080-d9a9a7d6f5a0",page:"movies.html"},

{title:"Standup Night",image:"https://images.unsplash.com/photo-1514525253161-7a46d19cd819",page:"events.html"},

{title:"Food Festival",image:"https://images.unsplash.com/photo-1504674900247-0877df9cc836",page:"events.html"},

{title:"Sunburn Festival",image:"https://images.unsplash.com/photo-1501386761578-eac5c94b800a",page:"events.html"},

{title:"Tech Summit",image:"https://images.unsplash.com/photo-1505373877841-8d25f7d46678",page:"events.html"},

{title:"Cricket League",image:"https://images.unsplash.com/photo-1531415074968-036ba1b575da",page:"sports.html"},

{title:"Football Match",image:"https://images.unsplash.com/photo-1522778119026-d647f0596c20",page:"sports.html"},

{title:"Tennis Grand Slam",image:"https://images.unsplash.com/photo-1521412644187-c49fa049e84d",page:"sports.html"},

{title:"IPL Final",image:"https://images.unsplash.com/photo-1540747913346-19e32dc3e97e",page:"sports.html"},

{title:"Paradise Biryani",image:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba",page:"restaurants.html"},

{title:"Buffet Nation",image:"https://images.unsplash.com/photo-1555992336-03a23c7b20ee",page:"restaurants.html"},

{title:"Pizza Hut Style",image:"https://images.unsplash.com/photo-1601924582970-9238bcb495d9",page:"restaurants.html"},

{title:"Burger House",image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd",page:"restaurants.html"},

{title:"Stand-Up Special",image:"https://images.unsplash.com/photo-1527224538127-2104bb71c51b",page:"theatre-comedy.html"},

{title:"Comedy Night",image:"https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=800&q=80",page:"theatre-comedy.html"},

{title:"Drama Play",image:"https://images.unsplash.com/photo-1503095396549-807759245b35",page:"theatre-comedy.html"},

{title:"Open Mic Show",image:"https://images.unsplash.com/photo-1516450360452-9312f5e86fc7",page:"theatre-comedy.html"}

];

const query =
new URLSearchParams(window.location.search).get("q");

const result =
document.getElementById("result");

const match = items.find(item =>
item.title.toLowerCase().includes(query.toLowerCase())
);

if(match){

result.innerHTML = `
<div class="result-card">

<img src="${match.image}">

<h2>${match.title}</h2>

<a class="btn" href="${match.page}">
Open
</a>

</div>
`;

}else{

result.innerHTML =
'<div class="not-found">No Result Found</div>';

}

</script>

</body>
</html>
