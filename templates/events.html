<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events | Zenith</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    color: white;
    font-family: Arial;

    background:
    radial-gradient(circle at top,
    rgba(255,0,0,0.35),
    transparent 40%),

    radial-gradient(circle at bottom,
    rgba(120,0,0,0.5),
    transparent 50%),

    linear-gradient(
    135deg,
    #000000,
    #120000,
    #1a0000,
    #000000
    );

    min-height: 100vh;
}

.navbar {
    background: #111;
}

.event-section {
    padding: 40px;
}

.event-card{
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    height: 350px;
    cursor: pointer;
}

.event-img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:0.5s;
}

.event-body{
    position:absolute;
    bottom:-100%;
    left:0;
    width:100%;
    padding:20px;
    background:rgba(0,0,0,0.85);
    transition:0.5s ease;
}

.event-card:hover .event-body{
    bottom:0;
}

.event-card:hover .event-img{
    transform:scale(1.1);
}

.event-meta{
    margin-top:10px;
    background:rgba(255,0,0,0.08);
    padding:10px;
    border-radius:10px;
}

.book-btn{
    display:block;
    text-align:center;
    background:linear-gradient(45deg,#ff416c,#ff4b2b);
    color:white;
    text-decoration:none;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,0,0,0.04) 0px,
        rgba(255,0,0,0.04) 8px,
        transparent 8px,
        transparent 40px
    );
    pointer-events:none;
    z-index:-1;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <a class="navbar-brand text-white" href="#">🎟 Zenith Events</a>
</nav>

<div class="container event-section">
<div class="row g-4">

{% for event in events %}

<div class="col-md-3">
  <div class="event-card">

    <img src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7"
         class="event-img">

    <div class="event-body">

      <h5>{{ event.title }}</h5>

      <p>{{ event.category }}</p>

      <div class="event-meta">

        <p>📅 Date: {{ event.event_date }}</p>

        <p>⏰ Time: {{ event.event_time }}</p>

        <p>📍 Venue: {{ event.venue }}</p>

        <p>💰 Price: ₹{{ event.price }}</p>

        <p>🎟 Seats: {{ event.available_seats }}</p>

      </div>

      <a href="{% url 'event_details' %}?id={{ event.id }}"
         class="book-btn">
         Book Now
      </a>

    </div>

  </div>
</div>

{% endfor %}

</div>
   

</body>
</html>
