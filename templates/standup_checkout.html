<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Zenith</title>
<style>
    .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 10px;
    }
    .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }
    /* Optional: Style the radio buttons to be more visible */
    input[type="radio"] {
        width: auto;
        margin-top: 0;
    }
</style>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; padding: 50px; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 450px; border: 1px solid #ff1744; }
        .field { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #333; background: #222; color: white; }
        .pay-btn { width: 100%; padding: 15px; background: #ff1744; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Checkout Details</h2>
    <div id="summary-display">
        <p>Event: <b id="eventName"></b></p>
        <p>Seats: <b id="seats"></b></p>
        <p>Total: <b id="total"></b></p>
    </div>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #333;">
    
   <form id="checkoutForm">
    <div class="field">
    <label>Full Name</label>
    <input 
        type="text" 
        id="name" 
        pattern="[A-Za-z\s]+" 
        oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '');" 
        placeholder="Enter your name" 
        required
    >
</div>

    <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>
    </div>

    <div class="field">
    <label>Contact Number</label>
    <input 
        type="tel" 
        id="phone" 
        pattern="[0-9]{10}" 
        maxlength="10" 
        oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" 
        placeholder="Enter 10-digit number" 
        required
    >
</div>

    <div class="field">
        <label>Select Payment Mode</label>
        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="paymentMode" value="Credit/Debit Card" required>
                Credit/Debit Card
            </label>
            <label class="radio-option">
                <input type="radio" name="paymentMode" value="Razorpay" required>
                Razorpay
            </label>
        </div>
    </div>
    <button type="submit" class="pay-btn">Confirm Payment</button>
</form>
</div>

<script>
    const data = JSON.parse(localStorage.getItem('bookingData'));
    
    if (data) {
        document.getElementById('eventName').innerText = data.eventName;
        document.getElementById('seats').innerText = data.seats;
        document.getElementById('total').innerText = "₹" + data.total;
    }

   document.getElementById('checkoutForm').onsubmit = (e) => {
    e.preventDefault();
    
    const userDetails = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        payment: document.querySelector('input[name="paymentMode"]:checked').value
    };
    
    console.log("Processing booking for:", userDetails);
    
    // You can also store the user details if needed for a final receipt page
    localStorage.setItem('userDetails', JSON.stringify(userDetails));
    
    alert(`Thank you, ${userDetails.name}! A confirmation has been sent to ${userDetails.email}.`);
};

document.getElementById('checkoutForm').onsubmit = function(e) {
    e.preventDefault();
    
    const paymentMode = document.querySelector('input[name="paymentMode"]:checked').value;
    
    // Save user info to LocalStorage so payment.html can read it
    const userDetails = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value
    };
    localStorage.setItem('userDetails', JSON.stringify(userDetails));

    if (paymentMode === "Credit/Debit Card") {
        window.location.href = 'payment.html'; // Redirect to card page
    } else {
        openRazorpay(); // Call your existing Razorpay function
    }
};
function openRazorpay(amount) {
    var options = {
        "key": "YOUR_RAZORPAY_KEY_ID", // Replace with your Key ID from Razorpay Dashboard
        "amount": amount, 
        "currency": "INR",
        "name": "Zenith Comedy Club",
        "description": "Ticket Booking",
        "handler": function (response) {
            alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
            // Here you would redirect to a success page
        },
        "prefill": {
            "name": document.getElementById('name').value,
            "email": document.getElementById('email').value,
        },
        "theme": { "color": "#ff1744" }
    };
    var rzp1 = new Razorpay(options);
    rzp1.open();
}</script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
