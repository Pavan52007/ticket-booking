<!DOCTYPE html>
<html>
<head>

<title>Ticket</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#120000;
    color:white;
}

.ticket{
    max-width:600px;
    margin:50px auto;
    background:#1f1f1f;
    border-radius:20px;
    padding:30px;
    text-align:center;
}

.qr{
    width:180px;
    margin:20px auto;
}

</style>

</head>

<body>

<div class="ticket">

<h1>🎫 Zenith Ticket</h1>

<hr>

<h3>Booking ID</h3>

<h2>ZEN{{ booking.id }}</h2>

<p>
🎬 Movie : {{ booking.movie.title }}
<br><br>

💺 Seats : {{ booking.seats }}
<br><br>

💰 Amount : ₹{{ booking.amount }}
<br><br>

📅 Booked On : {{ booking.booking_date }}
</p>

<img
class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ booking }}"
>

<br>

<button
onclick="window.print()"
class="btn btn-danger">
Download Ticket
</button>

</div>

</body>
</html>
