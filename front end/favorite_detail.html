<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ item.name }}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#ff0080 0%,transparent 25%),
    radial-gradient(circle at bottom right,#00d4ff 0%,transparent 25%),
    linear-gradient(135deg,#0f172a,#111827,#020617);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.detail-card{
    width:100%;
    max-width:1100px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;
    overflow:hidden;
    display:grid;
    grid-template-columns:420px 1fr;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.poster{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.content{
    padding:40px;
    color:white;
}

.title{
    font-size:42px;
    font-weight:800;
    margin-bottom:15px;
}

.category{
    display:inline-block;
    padding:8px 18px;
    border-radius:25px;
    background:rgba(255,0,128,.2);
    color:#ff4d6d;
    margin-bottom:25px;
    font-weight:600;
}

.info{
    font-size:17px;
    color:#e2e8f0;
    margin-bottom:12px;
}

.desc{
    margin-top:25px;
    line-height:1.8;
    color:#cbd5e1;
    font-size:16px;
}

.buttons{
    margin-top:35px;
    display:flex;
    gap:15px;
}

.btn-back{
    background:linear-gradient(45deg,#38bdf8,#0284c7);
    color:white;
    text-decoration:none;
    padding:12px 28px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn-back:hover{
    transform:translateY(-3px);
    color:white;
}

.btn-remove{
    background:linear-gradient(45deg,#dc2626,#991b1b);
    color:white;
    text-decoration:none;
    padding:12px 28px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn-remove:hover{
    transform:translateY(-3px);
    color:white;
}

@media(max-width:900px){

.detail-card{
    grid-template-columns:1fr;
}

.poster{
    height:450px;
}

.title{
    font-size:30px;
}

}

</style>
</head>

<body>

<div class="detail-card">

    <div class="poster">
        <img src="{{ item.image }}" alt="{{ item.name }}">
    </div>

    <div class="content">

        <h1 class="title">
            {{ item.name }}
        </h1>

        <div class="category">
            {{ item.category }}
        </div>

        <div class="info">
            📍 <strong>Location:</strong> {{ item.location }}
        </div>

        {% if item.date %}
        <div class="info">
            📅 <strong>Date:</strong> {{ item.date }}
        </div>
        {% endif %}

        <div class="desc">
            {{ item.description }}
        </div>

        <div class="buttons">

            <a href="{% url 'favorites' %}" class="btn-back">
                ← Back
            </a>

            <a href="{% url 'remove_favorite' item.id %}" class="btn-remove">
                Remove Favorite
            </a>

        </div>

    </div>

</div>

</body>
</html>
