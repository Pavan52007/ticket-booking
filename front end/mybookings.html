<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Bookings | Zenith</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#120000,#2b0000,#120000);
    color:white;
    min-height:100vh;
    font-family:Poppins,sans-serif;
}

.heading{
    text-align:center;
    padding:30px;
    color:#ff5e5e;
    font-weight:700;
}

.ticket-card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,.1);
    transition:.3s;
}

.ticket-card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(255,80,80,.4);
}

.status{
    color:#00ff88;
    font-weight:bold;
}

.btn-ticket{
    background:#ff2e63;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    text-decoration:none;
}

.btn-ticket:hover{
    color:white;
    background:#ff174f;
}

</style>
</head>

<body>

<div class="container">

    <h1 class="heading">🎫 My Bookings</h1>

    <div class="ticket-card">
        <h3>🎵 Sunburn Festival</h3>
        <p>📅 10 July 2026</p>
        <p>📍 Hyderabad</p>
        <p class="status">✅ Confirmed</p>

        <a href="/ticket/?booking=SUN001" class="btn btn-danger w-100">
            View Ticket
        </a>
    </div>

    <div class="ticket-card">
        <h3>🏏 CSK vs MI</h3>
        <p>📅 22 July 2026</p>
        <p>📍 Mumbai</p>
        <p class="status">✅ Confirmed</p>

        <a href="/ticket/?booking=SUN001" class="btn btn-danger w-100">
            View Ticket
        </a>
    </div>

    <div class="ticket-card">
        <h3>🍽 Paradise Biryani</h3>
        <p>📅 15 June 2026</p>
        <p>📍 Hyderabad</p>
        <p class="status">✅ Completed</p>

        <a href="/ticket/?booking=SUN001" class="btn btn-danger w-100">
            View Ticket
        </a>
    </div>

</div>

</body>
</html>
