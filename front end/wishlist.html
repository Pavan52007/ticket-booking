
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wishlist</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#000,#180000,#000);
    color:white;
}

h1{
    text-align:center;
    padding:20px;
}

#wishlistContainer{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.wishlist-card{
    width:250px;
    background:#1d1d1d;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 15px rgba(255,0,0,.4);
}

.wishlist-card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.wishlist-card h3{
    text-align:center;
    margin:0;
    padding:15px;
    color:white;
}

.remove-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:35px;
    height:35px;
    border-radius:50%;
    background:red;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

<div id="wishlistContainer"></div>

<script>

function removeWishlist(title){

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    wishlist = wishlist.filter(function(item){

        return (item.title || item.name) !== title;

    });

    localStorage.setItem("wishlist", JSON.stringify(wishlist));

    renderWishlist();

}

function renderWishlist(){

    const container = document.getElementById("wishlistContainer");

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    // Remove old broken entries
    wishlist = wishlist.filter(function(item){

        return (item.title || item.name) && item.image;

    });

    localStorage.setItem("wishlist", JSON.stringify(wishlist));

    container.innerHTML = "";

    if(wishlist.length===0){

        container.innerHTML="<h2>No items in wishlist ❤️</h2>";

        return;

    }

    wishlist.forEach(function(item){

        let title = item.title || item.name;

        let page = item.page || "#";

        container.innerHTML += `

        <div class="wishlist-card">

            <div class="remove-btn"
            onclick="removeWishlist('${title}')">
            🗑️
            </div>

            <a href="${page}">

                <img src="${item.image}" alt="${title}">

            </a>

            <h3>${title}</h3>

        </div>

        `;

    });

}

document.addEventListener("DOMContentLoaded", renderWishlist);

</script>

</body>
</html>
