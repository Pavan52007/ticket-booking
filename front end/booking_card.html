<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Bookings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    color:white;
    font-family:Poppins,sans-serif;

    background:
    radial-gradient(circle at top,
    rgba(255,0,60,.3),
    transparent 50%),

    linear-gradient(
    135deg,
    #100000,
    #220000,
    #300000,
    #120000
    );
}

.heading{
    text-align:center;
    margin:30px 0;
    color:#ff4d6d;
}

.booking-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    overflow:hidden;
    transition:.3s;
    height:100%;
}

.booking-card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(255,0,0,.4);
}

.booking-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.confirmed{
    background:#28a745;
}

.upcoming{
    background:#ff9800;
}

.btn-ticket{
    margin-top:10px;
    width:100%;
    border:none;
    padding:10px;
    border-radius:10px;
    background:#ff2e63;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<h1 class="heading">🎫 My Bookings</h1>

<div class="row g-4">

<!-- BOOKING 1 -->
<div class="col-md-4">
<div class="booking-card">

    <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1000">

<div class="card-body">

<h5>Sunburn Festival</h5>

<p>
📅 10 July 2026<br>
📍 Hyderabad
</p>

<span class="status confirmed">
Confirmed
</span>

<a href="{% url 'ticket' %}?booking=SUN001"
   class="btn btn-danger w-100 mt-2">
   View Ticket
</a>

</div>
</div>
</div>

<!-- BOOKING 2 -->
<div class="col-md-4">
<div class="booking-card">

<img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=1000">


<div class="card-body">

<h5>IPL Final</h5>

<p>
📅 25 June 2026<br>
📍 Ahmedabad Stadium
</p>

<span class="status upcoming">
Upcoming
</span>

<a href="{% url 'ticket' %}?booking=IPL001"
   class="btn btn-danger w-100 mt-2">
   View Ticket
</a>

</div>
</div>
</div>

<!-- BOOKING 3 -->
<div class="col-md-4">
<div class="booking-card">

    <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=1000">
<div class="card-body">

<h5>Food Festival</h5>

<p>
📅 18 June 2026<br>
📍 Hyderabad
</p>

<span class="status confirmed">
Confirmed
</span>

<a href="{% url 'ticket' %}?booking=FOOD001"
   class="btn btn-danger w-100 mt-2">
   View Ticket
</a>

</div>
</div>
</div>

</div>

</div>

</body>
</html>
